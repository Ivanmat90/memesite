<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заголовок страницы</title>
    <style>
        body {
            background-color: #15ff00;
            color: #007700;
            font-family: monospace;
            font-size: 50px;
        }

        hr {
            border: none;
            height: 20px;  
            background-color: #007700;
            border-radius: 10px;
        }

        .thing {
            background-color: #1f9900;
            padding: 10px 20px;
            margin: 10px 20px;
            border-radius: 20px;
        }

        h1 {
            background-color: #00a11b;
            padding: 10px 10px;
            margin: 15px 25px;
            border-radius: 25px;
            border-left: 14px solid #007700;
        }

        marquee {
            background-color: #00ff80;
            font-size: 40px;
            padding: 10px 10px;
            margin: 15px 25px;
            border-left: 14px solid #00ff00;
            border-radius: 20px;
        }
    </style>
  </head>
  <body>
    <hr>
    <section id="thing" class="thing">
        <h1>МАЙНКРАФТ!</h1>
        <marquee scrollamount="50">Я БЛИИИИН Mojang Из майнкрафта свинка собственная производства, майнкрафт был сделан шведским столом</marquee>
    </section>
    <hr>
  </body>
</html>
